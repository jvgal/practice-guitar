<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUITAR PRACTICE 🎸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111;color:#fff;font-family:'Archivo',sans-serif;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 50px}
h1{font-size:17px;font-weight:700;letter-spacing:.05em;margin:0 0 4px;border-bottom:2px solid #ec3013;padding-bottom:10px}
.toplink{display:block;margin:8px 0 2px;color:#ec3013;font-size:12px;font-weight:700;text-decoration:none;letter-spacing:.04em}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;color:#ec3013;margin:26px 0 8px;border-top:2px solid #262626;padding-top:16px}
.leg{font-size:11px;color:#999;line-height:1.7;margin:6px 0}
.leg b{color:#fff}
.langbar{display:flex;justify-content:flex-end;margin:0 0 6px}
.langbar select{background:#181818;border:2px solid #444;color:#fff;font-family:inherit;font-size:11px;font-weight:700;padding:5px 8px;cursor:pointer}

/* metronome */
.bpm{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px}
.bpm .num{font-size:60px;font-weight:700;min-width:140px;text-align:center;font-variant-numeric:tabular-nums}
.bpm button{width:50px;height:50px;border:2px solid #fff;background:none;color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
.bpm button:active{background:#ec3013;border-color:#ec3013}
input[type=range]{width:100%;accent-color:#ec3013;margin:6px 0 12px}
.beats{display:flex;gap:8px;justify-content:center;margin:2px 0 10px}
.dot{width:15px;height:15px;border:2px solid #555;border-radius:50%}
.dot.on{background:#ec3013;border-color:#ec3013}
#cellView{display:block;margin:2px auto 10px;background:#181818;border:2px solid #262626;width:100%}
.stem{stroke:#fff;stroke-width:3}.stem.hot{stroke:#ec3013}.beam{stroke:#fff;stroke-width:5}.beam2{stroke:#fff;stroke-width:4}.tbr{stroke:#888;stroke-width:1.4}
.cellname{font-size:10px;fill:#888;font-family:Archivo}
.play{width:100%;padding:16px;border:2px solid #ec3013;background:#ec3013;color:#fff;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.play.off{background:none;color:#ec3013}
#fab{position:fixed;right:16px;bottom:16px;z-index:50;width:66px;height:66px;border-radius:50%;border:none;background:#ec3013;color:#fff;font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#fab.off::after{content:'▶'}#fab.on::after{content:'◼'}
#fab .cd{font-size:26px}
#countOverlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.82);font-size:120px;font-weight:700;color:#ec3013}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 2px}
.cell{border:2px solid #444;background:none;color:#bbb;font-family:inherit;font-size:10px;font-weight:700;padding:9px 2px;cursor:pointer;line-height:1.3}
.cell small{display:block;font-size:8.5px;font-weight:500;color:#777}
.cell.on{border-color:#ec3013;color:#fff}.cell.on small{color:#ffb3a6}

/* diagrams */
.diag{background:#181818;border:2px solid #262626;margin:8px 0}
.shapegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:460px){.shapegrid{grid-template-columns:1fr 1fr 1fr}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chip2{border:2px solid #444;background:none;color:#bbb;font-family:inherit;font-size:11px;font-weight:700;padding:7px 10px;cursor:pointer}
.chip2.on{border-color:#ec3013;color:#fff;background:#1d1210}
#fretboard{background:#181818;border:2px solid #262626;display:block;margin:8px 0;width:100%}
#scaleBoard{background:#181818;border:2px solid #262626;display:block;margin:8px 0;width:100%}
.notecard{display:flex;align-items:center;gap:16px;border:2px solid #ec3013;background:#1d1210;padding:14px;margin:10px 0}
.notecard .nn{font-size:40px;font-weight:700;color:#fff;line-height:1;min-width:70px;text-align:center}
.notecard .gg{font-size:26px;font-weight:700;color:#ec3013}
.notecard .meta{font-size:12px;color:#ffb3a6;margin-top:4px}
.stepbtns{display:flex;gap:8px;margin:8px 0}
.stepbtns button{flex:1;padding:13px;border:2px solid #fff;background:none;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.stepbtns button:active{background:#fff;color:#111}
.stepbtns .auto{border-color:#ec3013;color:#ec3013}
.stepbtns .auto.on{background:#ec3013;color:#fff}
.chordbox{display:flex;align-items:center;gap:16px;border:2px solid #ec3013;background:#1d1210;padding:14px 14px;margin:10px 0}
.chordbox .txt{flex:1}
.chordbox .big{font-size:24px;font-weight:700;color:#fff;line-height:1.1}
.chordbox .sm{font-size:12px;color:#ffb3a6;margin-top:5px;line-height:1.5}
.cyclerow{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;cursor:pointer}
.sw{width:46px;height:26px;border:2px solid #555;border-radius:14px;position:relative;transition:.15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#777;transition:.15s}
.toggle.on .sw{border-color:#ec3013;background:#3a1510}
.toggle.on .sw::after{left:22px;background:#ec3013}
.cpt{border:2px solid #444;background:none;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:6px 8px}
.cycleseq{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ckey{font-size:10px;font-weight:700;border:1.5px solid #333;color:#777;padding:3px 6px}
.ckey.on{border-color:#ec3013;color:#fff;background:#ec3013}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <select id="lang"><option value="en">EN</option><option value="pt">PT</option></select>
  </div>
  <h1 id="t-title">GUITAR PRACTICE 🎸</h1>
  <a class="toplink" id="t-warmup" href="./warmup.html">🔥 chromatic warm-up →</a>
  <a class="toplink" id="t-builder" href="./scale-builder.html">✍️ build the scale (quiz) →</a>

  <!-- ===== UNIFIED METRONOME ===== -->
  <div class="sec" id="t-sec-metro" style="border-top:none;padding-top:4px">METRONOME</div>
  <div class="bpm">
    <button id="m5">−5</button><button id="m1">−1</button>
    <div class="num" id="bpmNum">92</div>
    <button id="p1">+1</button><button id="p5">+5</button>
  </div>
  <input type="range" id="bpmSlider" min="40" max="220" value="92">
  <div class="beats" id="beats"></div>
  <svg id="cellView" height="84" viewBox="0 0 300 84"></svg>
  <div class="cells" id="cells"></div>
  <button class="play off" id="play">▶ PLAY</button>
  <div class="leg" id="t-leg-metro"></div>

  <!-- ===== 5 SHAPES REFERENCE ===== -->
  <div class="sec" id="t-sec-shapes">SCALE + CHORD — the 5 shapes (CAGED)</div>
  <div class="leg" id="t-leg-shapes"></div>
  <div class="shapegrid" id="shapes"></div>

  <!-- ===== SCALES NOTE BY NOTE ===== -->
  <div class="sec" id="t-sec-scales">SCALES — note by note</div>
  <div class="leg" id="t-leg-scales"></div>
  <div class="chips" id="scaleTypes"></div>
  <div class="chips" id="scaleRoots"></div>
  <div class="chips" id="scaleShapes"></div>
  <div class="notecard">
    <div class="nn" id="noteName">—</div>
    <div class="txt"><div class="gg" id="noteDegree">degree</div><div class="meta" id="noteMeta"></div></div>
  </div>
  <svg id="scaleBoard" viewBox="0 0 740 150"></svg>
  <div class="stepbtns">
    <button id="scalePrev">◀</button>
    <button class="auto" id="scalePlay">▶ PLAY WITH METRONOME</button>
    <button id="scaleNext">▶</button>
  </div>
  <div class="leg" id="t-leg-scales2"></div>

  <!-- ===== CONNECTING THE SHAPES ===== -->
  <div class="sec" id="t-sec-conn">CONNECTING THE SHAPES — up the neck</div>
  <div class="leg" id="t-leg-conn"></div>
  <div class="notecard">
    <div class="nn" id="connPos">Position 1/5</div>
  </div>
  <svg id="connBoard" viewBox="0 0 740 150"></svg>
  <div class="stepbtns">
    <button id="connPrev">◀</button>
    <button class="auto" id="connPlay">▶ PLAY WITH METRONOME</button>
    <button id="connNext">▶</button>
  </div>
  <div class="leg"><span id="connMeta"></span><span id="t-leg-conn2"></span></div>

  <!-- ===== INTERACTIVE FRETBOARD ===== -->
  <div class="sec" id="t-sec-fret">INTERACTIVE FRETBOARD</div>
  <div class="leg" id="t-leg-fret"></div>
  <div class="chips" id="roots"></div>
  <div class="chips" id="shapePick"></div>
  <div class="chordbox" id="chordCard"></div>
  <svg id="fretboard" viewBox="0 0 740 150"></svg>

  <div class="leg" id="t-leg-fret2"></div>

  <!-- ===== CYCLE OF 4THS ===== -->
  <div class="sec" id="t-sec-cycle">CYCLE OF 4THS — exercise</div>
  <div class="leg" id="t-leg-cycle"></div>
  <div class="cyclerow">
    <label style="font-size:11px;color:#999" id="t-barsper">bars per key:
      <select class="cpt" id="cpt"><option>1</option><option selected>2</option><option>4</option></select>
    </label>
  </div>
  <div class="cycleseq" id="cycleSeq"></div>
  <div class="stepbtns">
    <button class="auto" id="cyclePlay" style="flex:1">▶ PLAY WITH METRONOME</button>
  </div>
  <button id="fab" class="off" aria-label="play"></button>
  <div id="countOverlay"></div>
</div>

<script>
// ---------- i18n ----------
const T = {
  en:{
    title:'GUITAR PRACTICE 🎸',
    warmup:'🔥 chromatic warm-up →',
    builder:'✍️ build the scale (quiz) →',
    secMetro:'METRONOME',
    legMetro:'The metronome plays the <b>selected rhythmic cell</b>. It drives everything on this page — including the cycling fretboard down below.',
    secShapes:'SCALE + CHORD — the 5 shapes (CAGED)',
    legShapes:'<span style="display:inline-block;width:10px;height:10px;border:2px solid #aaa;border-radius:50%;vertical-align:-1px"></span> scale note &nbsp; <span style="display:inline-block;width:10px;height:10px;background:#ec3013;border-radius:50%;vertical-align:-1px"></span> CHORD note &nbsp; <b style="color:#ec3013">R</b> = root',
    secScales:'SCALES — note by note',
    legScales:'Pick the <b>scale</b> and the <b>root</b>. Step through note by note (◀ ▶ or auto at the metronome tempo) — hear the note, see its name and degree, and watch it light up on the fretboard. Also pick the <b>position</b> (CAGED shape) — it walks the <b>whole shape</b>, from the lowest string to the highest, up and back down.',
    legScales2:'◀ ▶ steps manually (plays the note). <b>PLAY WITH METRONOME</b> walks the scale up and down <b>in sync with the metronome and the cell</b> up top. Red = scale note · white ◯ = playing now · <b style="color:#ec3013">R</b> = root.',
    secConn:'CONNECTING THE SHAPES — up the neck',
    legConn:'Uses the <b>scale</b> and <b>root</b> chosen above. Climbs (and descends) the scale <b>across all 5 positions</b> of the neck, low to high — the exercise of <b>linking one shape into the next</b>. The current position lights up bright, the rest of the map stays dim.',
    legConn2:' — notice where the hand <b>jumps position</b>: that\'s where one shape becomes the next.',
    secFret:'INTERACTIVE FRETBOARD',
    legFret:'Pick the <b>key</b> and the <b>shape</b>: the fretboard lights up the scale. Start the metronome and play over it with the chosen cell.',
    legFret2:'Play over the static shape: start the metronome up top and go. Or run the <b>cycle of 4ths</b> below as an exercise.',
    secCycle:'CYCLE OF 4THS — exercise',
    legCycle:'Starts on the <b>key and shape chosen above</b> (e.g. G in the E shape) and walks the cycle G→C→F→B♭… <b>changing the shape along with it</b> E→D→C→A→G… It switches by itself in time (a cue chord marks the change), and you play the scale over it on the metronome cell.',
    barsPer:'bars per key:',
    play:'▶ PLAY', stop:'◼ STOP',
    playMetro:'▶ PLAY WITH METRONOME',
    stopScale:'◼ STOP SCALE', stopConn:'◼ STOP', stopCycle:'◼ STOP CYCLE',
    degree:'degree', root1:'1 (root)',
    note:'note', string:'string', fret:'fret',
    position:'Position', shapeSuffix:'shape',
    fullNeck:'full neck', major:'major',
    playKey:'Play', eachFinger:'each 🔴 = a finger', rootEq:'= root',
    fretLeft:'the number on the left is the fret on the neck', fr:'fr',
  },
  pt:{
    title:'EXERCÍCIOS — GUITARRA 🎸',
    warmup:'🔥 aquecimento psicomotor →',
    builder:'✍️ montar escala (teste) →',
    secMetro:'METRÔNOMO',
    legMetro:'O metrônomo toca a <b>célula selecionada</b>. Ele serve pra tudo nesta página — inclusive pro braço ciclar lá embaixo.',
    secShapes:'ESCALA + ACORDE — os 5 shapes (CAGED)',
    legShapes:'<span style="display:inline-block;width:10px;height:10px;border:2px solid #aaa;border-radius:50%;vertical-align:-1px"></span> nota da escala &nbsp; <span style="display:inline-block;width:10px;height:10px;background:#ec3013;border-radius:50%;vertical-align:-1px"></span> nota do ACORDE &nbsp; <b style="color:#ec3013">R</b> = tônica',
    secScales:'ESCALAS — nota a nota',
    legScales:'Escolhe a <b>escala</b> e a <b>tônica</b>. Anda nota por nota (◀ ▶ ou auto no tempo do metrônomo) — ouve a nota, vê o nome e o grau, e acende no braço. Escolhe também a <b>posição</b> (shape CAGED) — percorre o <b>shape inteiro</b>, da corda grave à aguda, subindo e descendo.',
    legScales2:'◀ ▶ anda manual (ouve a nota). O <b>TOCAR NO METRÔNOMO</b> faz a escala subir e descer <b>em sincronia com o metrônomo e a célula</b> lá de cima. Vermelho = nota da escala · ◯ branco = tocando agora · <b style="color:#ec3013">R</b> = tônica.',
    secConn:'CONECTAR OS SHAPES — subindo o braço',
    legConn:'Usa a <b>escala</b> e a <b>tônica</b> escolhidas ali em cima. Sobe (e desce) a escala <b>atravessando as 5 posições</b> do braço, do grave ao agudo — é o exercício de <b>ligar um shape no outro</b>. A posição atual acende forte, o resto do mapa fica apagado.',
    legConn2:' — repara onde a mão <b>pula de posição</b>: é ali que um shape vira o outro.',
    secFret:'BRAÇO INTERATIVO',
    legFret:'Escolhe o <b>tom</b> e o <b>shape</b>: o braço acende a escala. Liga o metrônomo e toca por cima na célula escolhida.',
    legFret2:'Toca por cima do shape parado: liga o metrônomo lá em cima e manda. Ou roda o <b>ciclo das 4ªs</b> abaixo como exercício.',
    secCycle:'CICLO DAS 4ªs — exercício',
    legCycle:'Começa no <b>tom e shape escolhidos acima</b> (ex. G no Shape E) e anda pelo ciclo G→C→F→B♭… <b>trocando o shape junto</b> E→D→C→A→G… Troca sozinho no tempo (acorde de aviso na virada), e você toca a escala por cima na célula do metrônomo.',
    barsPer:'compassos por tom:',
    play:'▶ TOCAR', stop:'◼ PARAR',
    playMetro:'▶ TOCAR NO METRÔNOMO',
    stopScale:'◼ PARAR ESCALA', stopConn:'◼ PARAR', stopCycle:'◼ PARAR CICLO',
    degree:'grau', root1:'1 (tônica)',
    note:'nota', string:'corda', fret:'casa',
    position:'Posição', shapeSuffix:'shape',
    fullNeck:'braço inteiro', major:'maior',
    playKey:'Toque', eachFinger:'cada 🔴 = um dedo', rootEq:'= tônica',
    fretLeft:'o número à esquerda é a casa no braço', fr:'ª',
  }
};
let lang = (localStorage.getItem('lang') || (navigator.language||'en')).toLowerCase().startsWith('pt') ? 'pt' : 'en';
function tr(){ return T[lang]; }

// ---------- data ----------
const CELLS = [
  {en:['PULSE','quarter note'], pt:['PULSO','semínima'], pat:[0], notes:[{p:0,b:0}]},
  {en:['1 EIGHTHS','2 eighth notes'], pt:['1 COLCHEIAS','2 colcheias'], pat:[0,.5], notes:[{p:0,b:1},{p:.5,b:1}]},
  {en:['2 SHUFFLE','swung eighths'], pt:['2 SHUFFLE','colcheias em swing'], pat:[0,2/3], notes:[{p:0,b:1},{p:2/3,b:1}], swing:true},
  {en:['3 TRIPLETS','eighth-note triplet'], pt:['3 TERCINAS','tercina de colcheias'], pat:[0,1/3,2/3], notes:[{p:0,b:1},{p:1/3,b:1},{p:2/3,b:1}], trip:true},
  {en:['4 SIXTEENTHS','4 sixteenth notes'], pt:['4 SEMICOLCH.','4 semicolcheias'], pat:[0,.25,.5,.75], notes:[{p:0,b:2},{p:.25,b:2},{p:.5,b:2},{p:.75,b:2}]},
  {en:['5 GALLOP','eighth + 2 sixteenths'], pt:['5 GALOPE','colcheia + 2 semicolcheias'], pat:[0,.5,.75], notes:[{p:0,b:1},{p:.5,b:2},{p:.75,b:2}]},
  {en:['6 REV. GALLOP','2 sixteenths + eighth'], pt:['6 GALOPE INV','2 semicolcheias + colcheia'], pat:[0,.25,.5], notes:[{p:0,b:2},{p:.25,b:2},{p:.5,b:1}]},
  {en:['7 SYNCOPATED','16th + 8th + 16th'], pt:['7 SINCOPADA','semi + colcheia + semi'], pat:[0,.25,.75], notes:[{p:0,b:2},{p:.25,b:1},{p:.75,b:2}]},
];
function cellName(c){ return c[lang][0]; }
function cellSub(c){ return c[lang][1]; }
function cellBeat(){ return lang==='pt'?'1 tempo':'1 beat'; }
const NOTES = ['C','D♭','D','E♭','E','F','F#','G','A♭','A','B♭','B'];
const CYCLE = [7,0,5,10,3,8,1,6,11,4,9,2]; // G C F Bb Eb Ab Db F# B E A D
const STRINGS = [4,9,2,7,11,4]; // open-string pitch classes, low E to high e
const ROOTPOS = {0:[5,3],1:[5,1],2:[6,3],3:[6,1],4:[4,1]};
const SHAPES = [
 {en:'C shape', pt:'Shape C', hintEn:'open C form', hintPt:'forma do Dó aberto', cols:4, notes:[[6,0,'s'],[6,1,'s'],[6,3,'s'],[5,0,'s'],[5,2,'s'],[5,3,'r'],[4,0,'s'],[4,2,'c'],[4,3,'s'],[3,0,'c'],[3,2,'s'],[2,0,'s'],[2,1,'r'],[2,3,'s'],[1,0,'c'],[1,1,'s'],[1,3,'s']]},
 {en:'A shape', pt:'Shape A', hintEn:'A-type barre', hintPt:'pestana tipo A', cols:4, notes:[[6,1,'s'],[6,3,'s'],[5,1,'r'],[5,3,'s'],[4,0,'s'],[4,1,'s'],[4,3,'c'],[3,0,'s'],[3,2,'s'],[3,3,'r'],[2,1,'s'],[2,3,'c'],[1,1,'c'],[1,3,'s']]},
 {en:'G shape', pt:'Shape G', hintEn:'open G form', hintPt:'forma do Sol aberto', cols:4, notes:[[6,0,'s'],[6,2,'s'],[6,3,'r'],[5,0,'s'],[5,2,'c'],[5,3,'s'],[4,0,'c'],[4,2,'s'],[3,0,'r'],[3,2,'s'],[2,0,'c'],[2,1,'s'],[2,3,'c'],[1,0,'s'],[1,2,'s'],[1,3,'r']]},
 {en:'E shape', pt:'Shape E', hintEn:'E-type barre', hintPt:'pestana tipo E', cols:4, notes:[[6,1,'r'],[6,3,'s'],[5,0,'s'],[5,1,'s'],[5,3,'c'],[4,0,'s'],[4,2,'s'],[4,3,'r'],[3,0,'s'],[3,2,'c'],[3,3,'s'],[2,1,'c'],[2,3,'s'],[1,0,'s'],[1,1,'r'],[1,3,'s']]},
 {en:'D shape', pt:'Shape D', hintEn:'open D form', hintPt:'forma do Ré aberto', cols:5, notes:[[6,1,'s'],[6,3,'s'],[6,4,'s'],[5,1,'s'],[5,3,'s'],[4,1,'r'],[4,3,'s'],[3,0,'s'],[3,1,'s'],[3,3,'c'],[2,1,'s'],[2,3,'s'],[2,4,'r'],[1,1,'s'],[1,3,'c'],[1,4,'s']]},
];
function shapeName(sh){ return sh[lang]; }
function shapeHint(sh){ return lang==='pt'?sh.hintPt:sh.hintEn; }

// ---------- state ----------
let bpm = +(localStorage.getItem('bpm')||92);
let cell = +(localStorage.getItem('cell')||1);
let keySel = 7, shapeSel = 3, cycling = false;
let playing=false, ctx=null, master=null, nextT=0, gBeat=0, timer=null;
function ensureCtx(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(!master){ master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination); } return ctx; }
function masterOn(){ master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(1, ctx.currentTime); }

// ---------- audio ----------
function tick(t, strong){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.frequency.value=strong?1500:1000;
  g.gain.setValueAtTime(strong?.5:.22,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.05);
  o.connect(g); g.connect(master||ctx.destination); o.start(t); o.stop(t+.06);
}
function freq(m){return 440*Math.pow(2,(m-69)/12);}
function chordCue(t, key){
  const root=40+((key-4)%12+12)%12;
  [0,4,7,12].forEach((iv,i)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=freq(root+iv);
    const t0=t+i*.03;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.16,t0+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+1.1);

}

// ---------- unified scheduler ----------
function cycleIdxOf(key){ return Math.max(0, CYCLE.indexOf(key)); }
let cycStart=0, shStart=3; // cycle index and shape where the run started
function schedule(){
  const dur=60/bpm, barBeats=4, bpk=+document.getElementById('cpt').value;
  while(nextT < ctx.currentTime+.12){
    const beatInBar=gBeat%barBeats;
    if(cycling){
      const keyPos = Math.floor(gBeat/(bpk*barBeats));
      const idx=(cycStart+keyPos)%12;
      const sh=(shStart+keyPos)%5;
      const key=CYCLE[idx];
      if(key!==keySel && beatInBar===0 && gBeat%(bpk*barBeats)===0){
        chordCue(nextT, key);
        const cIdx=idx, cSh=sh;
        setTimeout(()=>{ keySel=CYCLE[cIdx]; shapeSel=cSh; drawPickers(); drawFretboard(); markCycle(cIdx); }, Math.max(0,(nextT-ctx.currentTime)*1000));
      }
    }
    CELLS[cell].pat.forEach((f,i)=>{
      const tN=nextT+f*dur, q=(tN-ctx.currentTime)*1000;
      if(scalePlaying && scaleNotes.length){
        const w=scaleTake();
        pluckAt(scaleNotes[w].midi, tN);
        setTimeout(()=>{ if(!playing||!scalePlaying)return; scaleHi=w; drawScale(); }, Math.max(0,q));
        if(i===0 && beatInBar===0) tick(tN, true);
      } else if(connPlaying && connNotes.length){
        const w=connTake();
        pluckAt(connNotes[w].midi, tN);
        setTimeout(()=>{ if(!playing||!connPlaying)return; connHi=w; drawConn(); }, Math.max(0,q));
        if(i===0 && beatInBar===0) tick(tN, true);
      } else {
        tick(tN, i===0 && beatInBar===0);
      }
      setTimeout(()=>{ if(!playing)return; flash(i); }, Math.max(0,q));
    });
    const b=beatInBar, q=(nextT-ctx.currentTime)*1000;
    setTimeout(()=>{ if(!playing)return; paintBeat(b); }, Math.max(0,q));
    gBeat++; nextT+=dur;
  }
}
let counting=false;
function syncBtns(){
  const b=document.getElementById('play');
  b.textContent=playing?tr().stop:tr().play; b.classList.toggle('off',!playing);
  const fab=document.getElementById('fab'); fab.classList.toggle('on',playing); fab.classList.toggle('off',!playing);
}
function startScheduler(){
  if(cycling){ cycStart=cycleIdxOf(keySel); shStart=shapeSel; }
  nextT=ctx.currentTime+.08; gBeat=0; timer=setInterval(schedule,25); playing=true; syncBtns();
}
function play(){
  if(playing){ clearInterval(timer); playing=false; scaleReset(); connReset(); cycleOff(); if(master) master.gain.setTargetAtTime(.0001, ctx.currentTime, .01); syncBtns(); return; }
  if(counting) return;
  ensureCtx(); ctx.resume(); masterOn();
  counting=true;
  const dur=60/bpm, t0=ctx.currentTime+.1;
  const ov=document.getElementById('countOverlay'); ov.style.display='flex';
  document.getElementById('play').textContent='…';
  for(let i=0;i<4;i++){
    tick(t0+i*dur, true);
    setTimeout(()=>{ ov.textContent=(4-i); }, (t0+i*dur-ctx.currentTime)*1000);
  }
  setTimeout(()=>{ ov.style.display='none'; counting=false; startScheduler(); }, (t0+4*dur-ctx.currentTime)*1000);
}

// ---------- scales note by note ----------
const OPENMIDI=[40,45,50,55,59,64]; // strings 6..1 (low to high)
const SCALES=[

 {en:'Natural minor', pt:'Menor natural', int:[0,2,3,5,7,8,10], deg:['1','2','♭3','4','5','♭6','♭7']},
 {en:'Harmonic minor', pt:'Menor harmônica', int:[0,2,3,5,7,8,11], deg:['1','2','♭3','4','5','♭6','7']},
 {en:'Minor pent.', pt:'Pent. menor', int:[0,3,5,7,10], deg:['1','♭3','4','5','♭7']},
 {en:'Major pent.', pt:'Pent. maior', int:[0,2,4,7,9], deg:['1','2','3','5','6']},

function scalePcs(){ return SCALES[scaleType].int.map(iv=>(scaleRoot+iv)%12); }
function rootFretE(){ return ((scaleRoot-4)%12+12)%12; }
function noteInfo(midi){ const pc=midi%12; const sem=((pc-scaleRoot)%12+12)%12; const gi=SCALES[scaleType].int.indexOf(sem); return {deg: gi>=0?SCALES[scaleType].deg[gi]:'?', root:sem===0, name:NOTES[pc]}; }
function buildBox(p){
  const pcs=scalePcs(), start=(rootFretE()+PSTART[p])%12;
  const notes=[];
  for(let si=0; si<6; si++){
    for(let f=start; f<=start+3; f++){
      if(f<0||f>16) continue;
      const midi=OPENMIDI[si]+f;
      if(pcs.includes(midi%12)){ const inf=noteInfo(midi); notes.push({str:6-si, fret:f, midi, deg:inf.deg, root:inf.root, name:inf.name}); }
    }

}
function buildScale(){ scaleNotes=buildBox(scalePos); scaleHi=0; scaleWalk=0; scaleDir=1; }
const CONNWIN=[[0,4],[3,7],[5,9],[8,12],[11,15]];
function buildConn(){
  const pcs=scalePcs(); connNotes=[];
  CONNWIN.forEach((w,p)=>{
    for(let si=0; si<6; si++) for(let f=w[0]; f<=w[1]; f++){ const midi=OPENMIDI[si]+f; if(pcs.includes(midi%12)){ const inf=noteInfo(midi); connNotes.push({str:6-si, fret:f, midi, pos:p, deg:inf.deg, root:inf.root, name:inf.name}); } }
  });
  connNotes=connNotes.filter((n,i,a)=> i===0 || !(n.str===a[i-1].str && n.fret===a[i-1].fret && n.pos===a[i-1].pos));

function pluckAt(midi,t){

  g.gain.exponentialRampToValueAtTime(.001,t+.5);

}
function scaleBounce(){ if(scaleNotes.length<2){scaleWalk=0;scaleDir=1;return;} scaleWalk+=scaleDir; if(scaleWalk>=scaleNotes.length){scaleWalk=scaleNotes.length-2;scaleDir=-1;} if(scaleWalk<0){scaleWalk=1;scaleDir=1;} }
function scaleTake(){ const w=scaleWalk; scaleBounce(); return w; }
function connBounce(){ if(connNotes.length<2){connWalk=0;connDir=1;return;} connWalk+=connDir; if(connWalk>=connNotes.length){connWalk=connNotes.length-2;connDir=-1;} if(connWalk<0){connWalk=1;connDir=1;} }
function connTake(){ const w=connWalk; connBounce(); return w; }

function scaleManual(d){ if(!scaleNotes.length)return; scaleWalk=(scaleHi+d+scaleNotes.length)%scaleNotes.length; scaleHi=scaleWalk; scaleDir=d>=0?1:-1; scaleBounce(); const n=scaleNotes[scaleHi]; ensureCtx(); ctx.resume(); masterOn(); pluckAt(n.midi,ctx.currentTime); drawScale(); }
function drawConn(){
  const NF=16, X0=34, Y0=22, dy=20, fw=(740-X0-10)/NF;
  let svg='';
  for(let i=0;i<6;i++) svg+=`<line x1="${X0}" y1="${Y0+i*dy}" x2="${X0+NF*fw}" y2="${Y0+i*dy}" stroke="#444" stroke-width="${1+(5-i)*0.25}"/>`;

  [3,5,7,9,15].forEach(f=> svg+=`<circle cx="${X0+(f-0.5)*fw}" cy="${Y0+2.5*dy}" r="4" fill="#2c2c2c"/>`);
  svg+=`<circle cx="${X0+11.5*fw}" cy="${Y0+1.5*dy}" r="4" fill="#2c2c2c"/><circle cx="${X0+11.5*fw}" cy="${Y0+3.5*dy}" r="4" fill="#2c2c2c"/>`;
  for(let f=1;f<=NF;f++) svg+=`<text x="${X0+(f-0.5)*fw}" y="${Y0+5*dy+16}" text-anchor="middle" font-size="8.5" fill="#666" font-family="Archivo">${f}</text>`;
  const curPos = connNotes[connHi]?connNotes[connHi].pos:0;
  connNotes.forEach((n,i)=>{ const fret=n.fret; if(fret>NF)return; const y=Y0+(6-n.str)*dy, x=fret===0?X0-14:X0+(fret-0.5)*fw;

  });

  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  ['E','A','D','G','B','e'].forEach((c,i)=> svg+=`<text x="${X0+i*sx}" y="${Y0-12}" text-anchor="middle" font-size="10" fill="#888" font-family="Archivo">${c}</text>`);
  for(let i=0;i<6;i++) svg+=`<line x1="${X0+i*sx}" y1="${Y0}" x2="${X0+i*sx}" y2="${Y0+NC*sy}" stroke="#777" stroke-width="1.4"/>`;

  if(origin>0) svg+=`<text x="${X0-12}" y="${Y0+sy-6}" text-anchor="end" font-size="13" font-weight="bold" fill="#ec3013" font-family="Archivo">${origin+1}${tr().fr}</text>`;

    if(t==='r') svg+=`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff" font-family="Archivo">R</text>`;
  });

}
function drawFretboard(){
  const sh=SHAPES[shapeSel], origin=baseFret(keySel,shapeSel), NF=16, X0=34, Y0=22, dy=20, fw=(740-X0-10)/NF;
  let svg='';
  for(let i=0;i<6;i++) svg+=`<line x1="${X0}" y1="${Y0+i*dy}" x2="${X0+NF*fw}" y2="${Y0+i*dy}" stroke="#444" stroke-width="${1+(5-i)*0.25}"/>`;
  for(let f=0;f<=NF;f++) svg+=`<line x1="${X0+f*fw}" y1="${Y0}" x2="${X0+f*fw}" y2="${Y0+5*dy}" stroke="#3a3a3a" stroke-width="${f===0?4:1}"/>`;
  [3,5,7,9,15].forEach(f=> svg+=`<circle cx="${X0+(f-0.5)*fw}" cy="${Y0+2.5*dy}" r="4" fill="#2c2c2c"/>`);
  svg+=`<circle cx="${X0+11.5*fw}" cy="${Y0+1.5*dy}" r="4" fill="#2c2c2c"/><circle cx="${X0+11.5*fw}" cy="${Y0+3.5*dy}" r="4" fill="#2c2c2c"/>`;
  for(let f=1;f<=NF;f++) svg+=`<text x="${X0+(f-0.5)*fw}" y="${Y0+5*dy+16}" text-anchor="middle" font-size="8.5" fill="#666" font-family="Archivo">${f}</text>`;
  sh.notes.forEach(([str,col,t])=>{ const fret=origin+col; if(fret>NF)return; const y=Y0+(6-str)*dy,x=fret===0?X0-14:X0+(fret-0.5)*fw;
    if(t==='s') svg+=`<circle cx="${x}" cy="${y}" r="6.6" fill="#181818" stroke="#bbb" stroke-width="1.8"/>`;
    else{ svg+=`<circle cx="${x}" cy="${y}" r="7.4" fill="#ec3013"/>`; if(t==='r') svg+=`<text x="${x}" y="${y+3.2}" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#fff" font-family="Archivo">R</text>`; }});
  svg+=`<text x="${X0}" y="12" font-size="11" font-weight="bold" fill="#ec3013" font-family="Archivo">${NOTES[keySel]} ${tr().major} — ${shapeName(sh)}</text>`;
  document.getElementById('fretboard').innerHTML=svg;
  document.getElementById('chordCard').innerHTML=chordDiagram(sh, origin)+
    `<div class="txt"><div class="big">${tr().playKey} ${NOTES[keySel]} ${tr().major}</div><div class="sm">${shapeName(sh)} (${shapeHint(sh)})<br>${tr().eachFinger} · <b style="color:#fff">R</b> ${tr().rootEq}<br>${tr().fretLeft}</div></div>`;
}
function drawPickers(){
  document.getElementById('roots').innerHTML=CYCLE.map(t=>`<button class="chip2 ${t===keySel?'on':''}" data-t="${t}">${NOTES[t]}</button>`).join('');
  document.getElementById('shapePick').innerHTML=SHAPES.map((sh,i)=>`<button class="chip2 ${i===shapeSel?'on':''}" data-s="${i}">${shapeName(sh)}</button>`).join('');
}
function markCycle(idx){
  document.getElementById('cycleSeq').innerHTML = cycling
    ? CYCLE.map((t,i)=>`<span class="ckey ${i===idx?'on':''}">${NOTES[t]}</span>`).join('') : '';
}
document.getElementById('roots').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;keySel=+b.dataset.t;drawPickers();drawFretboard();if(cycling)markCycle(cycleIdxOf(keySel));});
document.getElementById('shapePick').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;shapeSel=+b.dataset.s;drawPickers();drawFretboard();});
function cycleOff(){ cycling=false; const t=document.getElementById('cyclePlay'); if(t){ t.classList.remove('on'); t.textContent=tr().playMetro; } markCycle(cycleIdxOf(keySel)); }
document.getElementById('cyclePlay').onclick=function(){
  cycling=!cycling; this.classList.toggle('on',cycling);
  this.textContent=cycling?tr().stopCycle:tr().playMetro;
  if(cycling){ scaleReset(); connReset(); markCycle(cycleIdxOf(keySel)); if(!playing) play(); }
  else { markCycle(cycleIdxOf(keySel)); if(playing && !scalePlaying && !connPlaying) play(); }
};

// ---------- i18n apply ----------
function applyI18n(){
  const x=tr();
  document.documentElement.lang = lang==='pt'?'pt-BR':'en';
  document.getElementById('t-title').textContent=x.title;
  document.getElementById('t-warmup').textContent=x.warmup;
  document.getElementById('t-builder').textContent=x.builder;
  document.getElementById('t-sec-metro').textContent=x.secMetro;
  document.getElementById('t-leg-metro').innerHTML=x.legMetro;
  document.getElementById('t-sec-shapes').textContent=x.secShapes;
  document.getElementById('t-leg-shapes').innerHTML=x.legShapes;
  document.getElementById('t-sec-scales').textContent=x.secScales;
  document.getElementById('t-leg-scales').innerHTML=x.legScales;
  document.getElementById('t-leg-scales2').innerHTML=x.legScales2;
  document.getElementById('t-sec-conn').textContent=x.secConn;
  document.getElementById('t-leg-conn').innerHTML=x.legConn;
  document.getElementById('t-leg-conn2').innerHTML=x.legConn2;
  document.getElementById('t-sec-fret').textContent=x.secFret;
  document.getElementById('t-leg-fret').innerHTML=x.legFret;
  document.getElementById('t-leg-fret2').innerHTML=x.legFret2;
  document.getElementById('t-sec-cycle').textContent=x.secCycle;
  document.getElementById('t-leg-cycle').innerHTML=x.legCycle;
  document.getElementById('t-barsper').childNodes[0].textContent=x.barsPer+' ';
  if(!playing) document.getElementById('play').textContent=x.play;
  if(!scalePlaying) document.getElementById('scalePlay').textContent=x.playMetro;
  if(!connPlaying) document.getElementById('connPlay').textContent=x.playMetro;
  if(!cycling) document.getElementById('cyclePlay').textContent=x.playMetro;
}
function renderAll(){
  applyI18n();
  drawCellBtns(); drawCell(); drawShapes();
  drawPickers(); drawFretboard();
  drawScaleUI(); drawScale(); drawConn();
  if(cycling) markCycle(cycleIdxOf(keySel));
}
const langSel=document.getElementById('lang');
langSel.value=lang;
langSel.onchange=()=>{ lang=langSel.value; localStorage.setItem('lang',lang); renderAll(); };

// ---------- init ----------
setBpm(bpm); buildScale(); buildConn(); renderAll();
</script>
</body>
</html>
